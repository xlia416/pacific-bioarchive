# Pacific BioArchive — 阿里云 FC 3.0 读路径。
# Cognito 参数由 scripts/deploy-aliyun.sh 从 AWS Stack Outputs 导出到环境，不写死。
edition: 3.0.0
name: pacific-bioarchive
access: default

vars:
  region: cn-hangzhou

resources:
  fc_query:
    component: fc3
    props:
      region: ${vars.region}
      functionName: pba-query
      description: Pacific BioArchive authenticated cross-cloud query read path
      runtime: python3.10
      code: ./fc-query
      handler: index.handler
      timeout: 60
      memorySize: 512
      internetAccess: true
      environmentVariables:
        PYTHONPATH: /code/python
        PATH: /code/python/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/code:/code/bin:/opt:/opt/bin
        COGNITO_REGION: ${env('COGNITO_REGION')}
        USER_POOL_ID: ${env('USER_POOL_ID')}
        USER_POOL_CLIENT_ID: ${env('USER_POOL_CLIENT_ID')}
        OSS_BUCKET: ${env('OSS_BUCKET')}
        OSS_ENDPOINT: ${env('OSS_ENDPOINT')}
        OSS_ACCESS_KEY_ID: ${env('ALIBABA_CLOUD_ACCESS_KEY_ID')}
        OSS_ACCESS_KEY_SECRET: ${env('ALIBABA_CLOUD_ACCESS_KEY_SECRET')}
      triggers:
        - triggerName: http
          triggerType: http
          description: JWT authentication is enforced inside the function
          qualifier: LATEST
          triggerConfig:
            authType: anonymous
            disableURLInternet: false
            methods: [GET, POST, OPTIONS]
